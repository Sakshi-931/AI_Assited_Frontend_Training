<div class="profile-page">
  <header class="page-header">
    <div>
      <h1 class="page-title">My Profile</h1>
      <p class="page-subtitle">View and verify your registered employee details and dependent records</p>
    </div>
  </header>

  <!-- Error State Alert -->
  @if (errorMessage(); as error) {
    <app-error-state [message]="error" (retry)="loadProfile()"></app-error-state>
  }

  <!-- Loading State -->
  @if (isLoading() && !employee()) {
    <app-loading-state message="Fetching personal and family records..."></app-loading-state>
  } @else if (employee(); as emp) {
    <div class="profile-layout-grid">
      <!-- Left / Main Column: Personal Details Card -->
      <section class="personal-section">
        <app-personal-details [employee]="emp"></app-personal-details>
      </section>

      <!-- Right Column: Emergency Contacts and Family Information -->
      <section class="side-sections">
        <app-emergency-contact [contacts]="emergencyContacts()"></app-emergency-contact>
        <app-family-info [family]="familyInfo()"></app-family-info>
      </section>
    </div>
  }
</div>
