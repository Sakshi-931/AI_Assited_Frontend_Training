<div class="dashboard-page">
  <header class="page-header">
    <div class="header-titles">
      <h1 class="page-title">Employee Dashboard</h1>
      <p class="page-subtitle">Welcome back! Here is your daily summary and punch status.</p>
    </div>
    <button type="button" class="refresh-btn" (click)="loadData()" aria-label="Refresh dashboard metrics">
      <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M23 4v6h-6M1 20v-6h6"></path>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
      Refresh
    </button>
  </header>

  <!-- Error State Alert -->
  @if (errorMessage(); as error) {
    <app-error-state [message]="error" (retry)="loadData()"></app-error-state>
  }

  <!-- Loading Spinner -->
  @if (isLoading() && !employee()) {
    <app-loading-state message="Fetching employee dashboard records..."></app-loading-state>
  } @else if (employee(); as emp) {
    <!-- Main Dashboard Metrics Layout -->
    <div class="dashboard-grid">
      <!-- Employee Profile Summary Card -->
      <app-employee-card [employee]="emp"></app-employee-card>

      <!-- Today's Punch Activity Card -->
      <app-punch-card [punch]="todayPunch()"></app-punch-card>
    </div>
  }
</div>
