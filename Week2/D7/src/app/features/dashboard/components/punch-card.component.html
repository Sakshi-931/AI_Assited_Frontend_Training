<div class="card punch-summary-card">
  <div class="card-header">
    <div class="title-with-icon">
      <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
      <h2 class="card-title">Today's Attendance</h2>
    </div>

    @if (punch(); as p) {
      <!-- Custom Status Directive applying dynamic badge styles -->
      <span [appStatusBadge]="p.status">{{ p.status }}</span>
    }
  </div>

  <div class="card-body">
    @if (punch(); as p) {
      <div class="punch-metrics-grid">
        <div class="metric-box">
          <span class="metric-label">Punch In</span>
          <span class="metric-value in">{{ p.punchIn }}</span>
        </div>

        <div class="metric-box">
          <span class="metric-label">Punch Out</span>
          <span class="metric-value out">{{ p.punchOut }}</span>
        </div>

        <div class="metric-box">
          <span class="metric-label">Working Hours</span>
          <span class="metric-value hours">{{ p.workingHours }}</span>
        </div>

        <div class="metric-box">
          <span class="metric-label">Status</span>
          <span class="metric-value">{{ p.status }}</span>
        </div>
      </div>

      <!-- Single Action Button toggling between Punch In, Punch Out, and Completed -->
      <div class="punch-action-row">
        @if (p.canPunchIn) {
          <button
            type="button"
            class="punch-btn punch-in-btn"
            (click)="onTogglePunch()"
            title="Click to punch in for today">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
              <polyline points="10 17 15 12 10 7"></polyline>
              <line x1="15" y1="12" x2="3" y2="12"></line>
            </svg>
            <span>Punch In</span>
          </button>
        } @else if (p.canPunchOut) {
          <button
            type="button"
            class="punch-btn punch-out-btn"
            (click)="onTogglePunch()"
            title="Click to punch out and complete today's shift">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>Punch Out</span>
          </button>
        } @else if (p.isCompleted) {
          <button
            type="button"
            class="punch-btn punch-done-btn"
            disabled
            title="Today's shift has been completed">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
              <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            <span>Shift Completed</span>
          </button>
        }
      </div>
    }
  </div>
</div>
