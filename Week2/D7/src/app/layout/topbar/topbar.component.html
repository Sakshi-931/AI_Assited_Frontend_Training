<header class="topbar">
  <div class="topbar-left">
    <div class="brand">
      <div class="brand-logo">ES</div>
      <span class="brand-name">EduSphere</span>
    </div>
  </div>

  <div class="topbar-right">
    @if (currentEmployee(); as emp) {
      <div class="user-profile">
        <img [src]="emp.avatarUrl" [alt]="emp.name" class="user-avatar" />
        <div class="user-details">
          <span class="user-name">{{ emp.name }}</span>
          <span class="user-role">{{ emp.role }}</span>
        </div>
      </div>
    } @else {
      <div class="user-details-loading">
        <span class="user-name">Loading...</span>
      </div>
    }

    <!-- Sign Out Button -->
    <button
      type="button"
      class="logout-btn"
      (click)="logout()"
      title="Sign out of EduSphere"
      aria-label="Sign out">
      <svg class="logout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      <span class="logout-text">Sign Out</span>
    </button>
  </div>
</header>
